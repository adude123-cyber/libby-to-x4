<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Libby to X4</title>
<meta name="description" content="Send Libby loans to an Xteink X4 running CrossPoint with the Protected Content plugin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='4' width='20' height='24' fill='%23f4efe4' stroke='%231d1b17' stroke-width='2'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h8' stroke='%231d1b17' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root { --paper:#f4efe4; --ink:#1d1b17; --faded:#6d675c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#191815; --ink:#e9e3d6; --faded:#9a9384; } }
  :root[data-theme="dark"] { --paper:#191815; --ink:#e9e3d6; --faded:#9a9384; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.6 "Courier Prime","Courier New",Courier,monospace; }
  main { max-width:640px; margin:0 auto; padding:48px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:32px; }
  header b { letter-spacing:.04em; }
  header button { font:inherit; color:var(--faded); background:none; border:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:0; }
  footer { margin-top:40px; color:var(--faded); font-size:.85rem; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <header><b>libby &rarr; x4</b><button type="button" id="theme" aria-label="toggle theme">[ink]</button></header>
  <div id="app"></div>
  <footer>
    books stay encrypted on the card and expire with the loan.
    &middot; <a href="https://github.com/adude123-cyber/libby-to-x4" target="_blank" rel="noopener">source</a>
  </footer>
</main>
<script src="wizard.js"></script>
<script>
  window.LibbyX4.mount(document.getElementById('app'), { mode: 'remote' });
  (function () {
    var b = document.getElementById('theme'), root = document.documentElement;
    var get = function () { try { return localStorage.getItem('lx4.theme'); } catch (e) { return null; } };
    var isDark = function () { var t = root.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
    var apply = function (t) { if (t) root.dataset.theme = t; b.textContent = isDark() ? '[paper]' : '[ink]'; };
    apply(get());
    b.onclick = function () { var t = isDark() ? 'light' : 'dark'; try { localStorage.setItem('lx4.theme', t); } catch (e) {} apply(t); };
  })();
</script>
</body>
</html>
